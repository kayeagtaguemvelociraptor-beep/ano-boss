<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DO NOT CLICK</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;
    color: white;
    text-align: center;
  }

  button {
    padding: 20px 30px;
    font-size: 20px;
    border: none;
    border-radius: 20px;
    background: red;
    color: white;
    cursor: pointer;
  }

  #scare {
    position: fixed;
    width: 100%;
    height: 100%;
    background: black;
    color: red;
    font-size: 80px;
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
  }
</style>
</head>

<body>

<button onclick="goScare()">CLICK AT YOUR OWN RISK</button>

<div id="scare">
  <div>😱</div>
  <div>BOO!!!</div>
</div>

<script>
function goScare() {
  document.getElementById("scare").style.display = "flex";

  setTimeout(() => {
    document.getElementById("scare").style.display = "none";
  }, 2500);
}
</script>

</body>
</html>
